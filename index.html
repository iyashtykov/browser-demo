<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Report Builder</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1d2433; background: #fff; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  p.hint { color: #5b6475; margin-top: 0; }
  .step { border: 1px solid #d6dbe4; border-radius: 8px; padding: 16px; margin: 16px 0; }
  .step h2 { font-size: 16px; margin: 0 0 8px; }
  button, label.btn { display: inline-block; background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #9aa6bd; cursor: default; }
  input[type=file] { display: none; }
  table { border-collapse: collapse; margin-top: 8px; }
  td, th { border: 1px solid #d6dbe4; padding: 4px 10px; text-align: left; }
  #error { color: #b91c1c; }
  #status { color: #15803d; }
</style>
</head>
<body>
<h1>Score Report Builder</h1>
<p class="hint">Upload a CSV with <code>name,score</code> rows, then download the generated report.</p>

<div class="step">
  <h2>1. Upload data</h2>
  <label class="btn" for="file">Upload CSV</label>
  <input id="file" type="file" accept=".csv,text/csv">
  <span id="filename"></span>
  <div id="error"></div>
  <div id="preview"></div>
</div>

<div class="step">
  <h2>2. Download report</h2>
  <button id="download" disabled>Download report.csv</button>
  <div id="status"></div>
</div>

<script>
const PASS_MARK = 70;
let report = null;

function buildReport(text, sourceName) {
  const lines = text.replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2 || lines[0].toLowerCase() !== 'name,score') {
    throw new Error('The first line must be "name,score" followed by at least one row.');
  }
  const rows = lines.slice(1).map((l, i) => {
    const [name, score, extra] = l.split(',');
    const n = Number(score);
    if (!name || extra !== undefined || score === undefined || score.trim() === '' || !Number.isFinite(n)) {
      throw new Error('Line ' + (i + 2) + ' is not "name,score": ' + l);
    }
    return { name: name.trim(), score: n, passed: n >= PASS_MARK ? 'yes' : 'no' };
  });
  const total = rows.reduce((s, r) => s + r.score, 0);
  const passed = rows.filter(r => r.passed === 'yes').length;
  const out = ['# generated by browser-demo from ' + sourceName, 'name,score,passed']
    .concat(rows.map(r => r.name + ',' + r.score + ',' + r.passed))
    .concat(['TOTAL,' + total + ',' + passed]);
  return { csv: out.join('\n') + '\n', rows, total, passed };
}

function renderPreview(r) {
  const t = document.createElement('table');
  t.innerHTML = '<tr><th>name</th><th>score</th><th>passed</th></tr>' +
    r.rows.map(x => '<tr><td></td><td>' + x.score + '</td><td>' + x.passed + '</td></tr>').join('') +
    '<tr><th>TOTAL</th><th>' + r.total + '</th><th>' + r.passed + '</th></tr>';
  r.rows.forEach((x, i) => { t.rows[i + 1].cells[0].textContent = x.name; });
  const p = document.getElementById('preview');
  p.replaceChildren(t);
}

document.getElementById('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  const err = document.getElementById('error');
  err.textContent = '';
  document.getElementById('status').textContent = '';
  document.getElementById('preview').replaceChildren();
  report = null;
  document.getElementById('download').disabled = true;
  if (!f) return;
  document.getElementById('filename').textContent = f.name;
  try {
    report = buildReport(await f.text(), f.name);
    renderPreview(report);
    document.getElementById('download').disabled = false;
  } catch (ex) {
    err.textContent = ex.message;
  }
});

document.getElementById('download').addEventListener('click', () => {
  if (!report) return;
  const url = URL.createObjectURL(new Blob([report.csv], { type: 'text/csv' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'report.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  document.getElementById('status').textContent = 'report.csv downloaded.';
});
</script>
</body>
</html>
